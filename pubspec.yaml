name: arc
description: "A new Flutter project."
publish_to: 'none'

version: 1.3.5+1

environment:
  sdk: ^3.11.3

dependencies:
  flutter:
    sdk: flutter

  flutter_riverpod: ^2.5.1
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  cloud_firestore: ^5.0.2
  firebase_core: ^3.1.1
  firebase_auth: ^5.1.1
  flutter_local_notifications: ^17.2.1
  timezone: ^0.9.4
  fl_chart: ^0.69.0
  intl: ^0.19.0
  uuid: ^4.4.0
  flutter_slidable: ^3.1.1
  shared_preferences: ^2.2.3
  flutter_animate: ^4.5.0
  go_router: ^14.2.0
  lucide_icons: ^0.257.0
  google_sign_in: ^6.2.1
  crypto: ^3.0.3
  local_auth: ^3.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.9
  hive_generator: ^2.0.1
  flutter_launcher_icons: ^0.13.1

dependency_overrides:
  lucide_icons:
    path: packages/lucide_icons

flutter:
  uses-material-design: true

  assets:
    - assets/icon/
